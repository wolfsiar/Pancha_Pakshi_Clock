<style>
/* Layout concept: a 24-hour dial (day on the right half, night on the left) beside the slot in force; ten slots, five birds, one week strip. */
:root {
  --bg: #F1F3EE;
  --card: #FAFBF8;
  --card2: #E7EBE4;
  --ink: #13211E;
  --muted: #56655F;
  --line: #CDD5CC;
  --line-strong: #9AA89F;
  --accent: #A64709;
  --on-accent: #FFFFFF;
  --a-R: #0B4F48; --on-R: #FFFFFF;
  --a-E: #2F7F70; --on-E: #FFFFFF;
  --a-W: #D3A640; --on-W: #231A00;
  --a-S: #E6DCC6; --on-S: #2D2818;
  --a-D: #A8473B; --on-D: #FFFFFF;
  --hatch: rgba(255,255,255,.42);
  --font-display: "Newsreader", "Noto Serif Tamil", Georgia, serif;
  --font-body: "Instrument Sans", "Noto Sans Tamil", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1614; --card: #12221F; --card2: #1A2E2A; --ink: #E4EEE9; --muted: #97ABA4;
    --line: #27403A; --line-strong: #4A665F; --accent: #F2A55A; --on-accent: #1B0F02;
    --a-R: #5FD0BC; --on-R: #04201B; --a-E: #2E9A89; --on-E: #03130F; --a-W: #D7B04F; --on-W: #1E1600;
    --a-S: #5E5A48; --on-S: #F1ECDD; --a-D: #D9695C; --on-D: #2A0A06; --hatch: rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1614; --card: #12221F; --card2: #1A2E2A; --ink: #E4EEE9; --muted: #97ABA4;
  --line: #27403A; --line-strong: #4A665F; --accent: #F2A55A; --on-accent: #1B0F02;
  --a-R: #5FD0BC; --on-R: #04201B; --a-E: #2E9A89; --on-E: #03130F; --a-W: #D7B04F; --on-W: #1E1600;
  --a-S: #5E5A48; --on-S: #F1ECDD; --a-D: #D9695C; --on-D: #2A0A06; --hatch: rgba(0,0,0,.4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-block: 18px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.wrap > * { min-width: 0; max-width: 100%; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; line-height: 1.2; }
h2 { font-size: 1.35rem; } h3 { font-size: 1.08rem; }
p { margin: 0; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.num { font-variant-numeric: tabular-nums; }

/* sign-in pages */
:root { --auth-bg: #0B3A35; --auth-fg: #F2F7F4; --auth-mut: #BBD3CB; --auth-line: rgba(255,255,255,.16); --danger: #A8352A; --danger-bg: #FBEDEA; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --auth-bg: #0F2723; --danger: #FF9A8D; --danger-bg: #2E1713; } }
:root[data-theme="dark"] { --auth-bg: #0F2723; --danger: #FF9A8D; --danger-bg: #2E1713; }
body.auth-mode { padding: 0; margin: 0; }
body.auth-mode .wrap { max-width: none; gap: 0; }
body.auth-mode .top, body.auth-mode #banner, body.auth-mode .tabs, body.auth-mode #entry { display: none; }
.auth { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); min-height: 100vh; min-height: 100svh; }
.auth-brand { background: var(--auth-bg); color: var(--auth-fg); padding: 40px 48px; display: flex; flex-direction: column; justify-content: space-between; gap: 32px; position: relative; overflow: hidden; background-image: radial-gradient(circle at 12% 8%, rgba(95,208,188,.18), transparent 42%), radial-gradient(circle at 92% 96%, rgba(242,165,90,.14), transparent 40%); }
.auth-brand::after { content: ""; position: absolute; right: -300px; top: 24%; width: 760px; height: 760px; border-radius: 50%; background: repeating-radial-gradient(circle, transparent 0 62px, rgba(255,255,255,.08) 62px 63px); pointer-events: none; }
.auth-logo { display: flex; align-items: center; gap: 12px; font-family: var(--font-display); font-size: 1.35rem; font-weight: 600; position: relative; z-index: 1; overflow-wrap: anywhere; }
.auth-hero { display: flex; flex-direction: column; gap: 16px; max-width: 30rem; position: relative; z-index: 1; }
.auth-hero h2 { font-size: 2.1rem; line-height: 1.15; letter-spacing: -.01em; }
.auth-hero > p { color: var(--auth-mut); font-size: 1.05rem; }
.auth-points { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.auth-points li { display: flex; gap: 12px; align-items: flex-start; color: var(--auth-fg); }
.auth-points .ic { flex: none; margin-top: 2px; color: #7FE0CD; }
.auth-fine { color: var(--auth-mut); font-size: .85rem; position: relative; z-index: 1; }
.auth-main { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 24px 24px 40px; background: var(--bg); }
.auth-top { width: 100%; max-width: 420px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.auth-card { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 32px 28px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 1px 2px rgba(19,33,30,.06), 0 12px 32px -12px rgba(19,33,30,.18); }
.auth-head { display: flex; flex-direction: column; gap: 6px; }
.auth-badge { width: 44px; height: 44px; border-radius: 12px; background: var(--card2); display: grid; place-items: center; color: var(--ink); margin-bottom: 6px; }
.auth-badge .ic { width: 22px; height: 22px; }
.auth-title { font-size: 1.6rem; }
.fld { display: flex; flex-direction: column; gap: 6px; }
.fgrid { display: grid; grid-template-columns: 1fr; gap: 12px; }
.flab { font-weight: 600; font-size: .9rem; }
.fin { position: relative; display: flex; align-items: center; }
.fin .ic { position: absolute; left: 12px; color: var(--muted); pointer-events: none; }
.fin input[type], .fld textarea { width: 100%; background: var(--bg); border: 1px solid var(--line-strong); border-radius: 10px; padding: 11px 44px 11px 40px; min-height: 46px; max-width: 100%; }
.fld textarea { padding: 11px 12px; resize: vertical; min-height: 84px; }
.fin input:focus, .fld textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.eye { position: absolute; right: 4px; width: 38px; height: 38px; border: 0; background: transparent; border-radius: 8px; color: var(--muted); display: grid; place-items: center; }
.eye:hover { background: var(--card2); color: var(--ink); }
.eye[aria-pressed="true"] { color: var(--accent); }
.btn.block { width: 100%; min-height: 48px; justify-content: center; font-size: 1rem; display: inline-flex; align-items: center; }
.btn.ghost { border-color: transparent; }
.btn.ghost:hover { background: var(--card2); }
.chk { display: flex; gap: 10px; align-items: center; font-size: .9rem; }
.auth-alert { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger); font-size: .9rem; }
.auth-alert .ic { flex: none; margin-top: 1px; }
.auth-note { padding: 10px 12px; border-radius: 10px; background: var(--card2); font-size: .9rem; }
.caps { display: flex; gap: 8px; align-items: center; font-size: .85rem; color: var(--accent); margin-top: -6px; }
.caps[hidden] { display: none; }
.meter { display: flex; align-items: center; gap: 10px; margin-top: -4px; }
.mbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; flex: 1; }
.mbar i { height: 6px; border-radius: 3px; background: var(--line); }
.meter[data-lv="1"] .mbar i:nth-child(-n+1) { background: var(--a-D); }
.meter[data-lv="2"] .mbar i:nth-child(-n+2) { background: var(--a-W); }
.meter[data-lv="3"] .mbar i:nth-child(-n+3) { background: var(--a-E); }
.meter[data-lv="4"] .mbar i:nth-child(-n+4) { background: var(--a-R); }
.mtxt { font-size: .8rem; min-width: 4.5rem; color: var(--muted); text-align: right; }
.auth-sec { display: flex; gap: 8px; align-items: center; justify-content: center; font-size: .8rem; color: var(--muted); padding-top: 12px; border-top: 1px solid var(--line); }
.auth-alt { width: 100%; max-width: 420px; }
.auth-forgot { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; background: var(--card); }
.auth-forgot summary { cursor: pointer; font-weight: 500; font-family: var(--font-body); }
.auth-forgot[open] { display: flex; flex-direction: column; gap: 10px; }
@media (max-width: 800px) {
  .auth { grid-template-columns: 1fr; }
  .auth-brand { padding: 20px 20px 22px; gap: 0; }
  .auth-brand::after, .auth-hero, .auth-fine { display: none; }
  .auth-main { justify-content: flex-start; padding: 20px 16px 40px; }
  .auth-card { padding: 24px 20px; }
}

/* header */
.hdr-r { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.brand h1 { font-size: 1.9rem; letter-spacing: -.01em; }
.brand .sub { color: var(--muted); font-size: .9rem; }
.langs { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 999px; overflow: hidden; }
.langs button { border: 0; background: transparent; padding: 6px 14px; min-height: 36px; }
.langs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line-strong); overflow-x: auto; }
.tabs button { background: transparent; border: 0; padding: 10px 16px; min-height: 44px; border-bottom: 3px solid transparent; color: var(--muted); font-weight: 500; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.plain { background: transparent; border-color: transparent; padding: 0; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.lbl { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 7px 12px; min-height: 38px; }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.btn { border: 1px solid var(--line-strong); background: transparent; border-radius: 8px; padding: 7px 12px; min-height: 38px; }
a.btn { display: inline-flex; align-items: center; text-decoration: none; color: inherit; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
select, input[type="date"], input[type="time"], input[type="datetime-local"] { background: var(--card); border: 1px solid var(--line-strong); border-radius: 8px; padding: 7px 10px; min-height: 38px; max-width: 100%; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; background: var(--card2); border: 1px solid var(--line); font-size: .82rem; max-width: 100%; overflow-wrap: anywhere; }
h1, h2, h3, strong { overflow-wrap: anywhere; }
.chip.warn { background: transparent; border-color: var(--accent); color: var(--accent); }
.note { border-left: 3px solid var(--accent); padding: 6px 12px; background: var(--card2); border-radius: 0 8px 8px 0; font-size: .92rem; }

/* activity colours */
.fill-R { background: var(--a-R); color: var(--on-R); } .fill-E { background: var(--a-E); color: var(--on-E); }
.fill-W { background: var(--a-W); color: var(--on-W); } .fill-S { background: var(--a-S); color: var(--on-S); }
.fill-D { background: var(--a-D); color: var(--on-D); }
.sv-R { fill: var(--a-R); } .sv-E { fill: var(--a-E); } .sv-W { fill: var(--a-W); } .sv-S { fill: var(--a-S); } .sv-D { fill: var(--a-D); }
.tx-R { fill: var(--on-R); } .tx-E { fill: var(--on-E); } .tx-W { fill: var(--on-W); } .tx-S { fill: var(--on-S); } .tx-D { fill: var(--on-D); }

.mono { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--ink); font-family: var(--font-display); font-weight: 600; font-size: .95rem; flex: none; background: var(--card); }
.mono.lg { width: 52px; height: 52px; font-size: 1.3rem; }

/* now layout */
.now-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
@media (min-width: 880px) { .now-grid { grid-template-columns: minmax(0, 440px) minmax(0, 1fr); align-items: start; } }
.dial { width: 100%; max-width: 440px; margin: 0 auto; display: block; }
.dial g[data-slot] { cursor: pointer; }
.dial g[data-slot]:focus, .dial g[data-slot]:focus-visible { outline: none; }
.dial g[data-slot]:focus-visible path.arc { stroke: var(--accent); stroke-width: 3; }
.dial path.arc { stroke: var(--line-strong); stroke-width: 1; }
.dial path.sel { fill: none; stroke: var(--accent); stroke-width: 3.5; pointer-events: none; }
.dial text { font-family: var(--font-body); }
.dial .hr { fill: var(--muted); font-size: 12.5px; }
.dial .c1 { fill: var(--muted); font-size: 13px; }
.dial .c2 { fill: var(--ink); font-family: var(--font-display); font-size: 25px; font-weight: 600; }
.dial .c3 { fill: var(--muted); font-size: 13px; }
.dial .pct { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.dial .needle { stroke: var(--accent); stroke-width: 2.5; }
.dial .nd { fill: var(--accent); stroke: var(--bg); stroke-width: 2; }

.cur { display: flex; flex-direction: column; gap: 10px; }
.cur .big { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.cur .act { font-family: var(--font-display); font-size: 2rem; line-height: 1.1; }
.badge { display: inline-flex; align-items: baseline; gap: 4px; padding: 4px 12px; border-radius: 8px; font-weight: 600; font-variant-numeric: tabular-nums; border: 1px solid var(--line-strong); }

.sched { display: flex; flex-direction: column; gap: 4px; }
.sched h3 { margin-top: 6px; }
.slot { display: grid; grid-template-columns: auto minmax(0, 1fr) 3rem; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 7px 10px; border-radius: 8px; border: 1px solid transparent; background: transparent; min-height: 44px; }
.slot:hover { background: var(--card2); }
.slot[aria-current="true"] { border-color: var(--accent); background: var(--card2); }
.slot[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: -2px; }
.slot .t { color: var(--muted); font-size: .88rem; font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 9.6rem; }
.slot .nm { display: flex; align-items: center; gap: 10px; min-width: 0; }
.slot .bar { height: 10px; border-radius: 5px; flex: none; border: 1px solid var(--line-strong); }
.slot .pv { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
@media (max-width: 520px) { .slot { grid-template-columns: auto minmax(0, 1fr) 2rem; gap: 8px; padding: 6px 6px; } .slot .t { font-size: .8rem; min-width: 8.6rem; } .slot .bar { display: none; } }

.birds-now { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.bn { display: flex; flex-direction: column; gap: 6px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); min-width: 0; }
.bn.me { border-color: var(--ink); border-width: 2px; }
.bn .hd { display: flex; align-items: center; gap: 8px; min-width: 0; }
.bn .st { padding: 3px 8px; border-radius: 6px; font-weight: 600; font-size: .85rem; align-self: flex-start; border: 1px solid var(--line-strong); }

/* week */
.wk { display: flex; flex-direction: column; gap: 10px; }
.wk-day { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
.wk-day.today { border-color: var(--accent); }
.wk-day.padu { background: repeating-linear-gradient(135deg, var(--card), var(--card) 10px, var(--card2) 10px, var(--card2) 20px); }
.wk-hd { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.wk-hd strong { font-family: var(--font-display); font-size: 1.05rem; }
.strip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) 10px repeat(5, minmax(0, 1fr)); gap: 3px; align-items: stretch; }
.strip .gap { background: transparent; }
.cell { border: 1px solid var(--line-strong); border-radius: 6px; min-height: 40px; padding: 2px 0; font-weight: 600; font-size: .8rem; font-variant-numeric: tabular-nums; }
.cell[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 1px; }
.cell.now { box-shadow: 0 0 0 2px var(--accent); }
.strip-lbl { display: grid; grid-template-columns: 1fr 1fr; font-size: .72rem; color: var(--muted); }
.strip-lbl span:last-child { text-align: right; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; }
.legend i { display: inline-block; width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--line-strong); }

/* birds */
.grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 12px; }
dl.kv { display: grid; grid-template-columns: minmax(5.5rem, auto) minmax(0, 1fr); gap: 6px 12px; margin: 0; font-size: .92rem; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.pillrow { display: flex; flex-wrap: wrap; gap: 4px; }
.pill { padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--card2); font-size: .8rem; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--line-strong); vertical-align: -1px; margin-right: 4px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opts button { border: 1px solid var(--line-strong); border-radius: 8px; padding: 7px 12px; min-height: 38px; background: transparent; }
.opts button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.via { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; width: 100%; padding: 8px 12px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--card); min-height: 52px; }
.via[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); background: var(--card2); }
.people { display: flex; flex-direction: column; gap: 8px; }
.person { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }

/* ---------- astronomy (Meeus, truncated) ---------- */
const RAD = Math.PI / 180;
const mod360 = (x) => ((x % 360) + 360) % 360;
function julianDay(date) { return date.getTime() / 86400000 + 2440587.5; }

function moonLongitude(jd) {
  const T = (jd - 2451545.0) / 36525;
  const Lp = mod360(218.3164477 + 481267.88123421 * T - 0.0015786 * T * T);
  const D = mod360(297.8501921 + 445267.1114034 * T - 0.0018819 * T * T);
  const M = mod360(357.5291092 + 35999.0502909 * T - 0.0001536 * T * T);
  const Mp = mod360(134.9633964 + 477198.8675055 * T + 0.0087414 * T * T);
  const F = mod360(93.2720950 + 483202.0175233 * T - 0.0036539 * T * T);
  const A1 = mod360(119.75 + 131.849 * T);
  const A2 = mod360(53.09 + 479264.290 * T);
  const E = 1 - 0.002516 * T - 0.0000074 * T * T;
  let sum = 0;
  for (const [d, m, mp, f, c] of MOON_TERMS) {
    const arg = (d * D + m * M + mp * Mp + f * F) * RAD;
    const ef = Math.abs(m) === 1 ? E : Math.abs(m) === 2 ? E * E : 1;
    sum += c * ef * Math.sin(arg);
  }
  sum += 3958 * Math.sin(A1 * RAD) + 1962 * Math.sin((Lp - F) * RAD) + 318 * Math.sin(A2 * RAD);
  return mod360(Lp + sum / 1e6);
}

function sunLongitude(jd) {
  const T = (jd - 2451545.0) / 36525;
  const L0 = mod360(280.46646 + 36000.76983 * T + 0.0003032 * T * T);
  const M = mod360(357.52911 + 35999.05029 * T - 0.0001537 * T * T) * RAD;
  const C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(M)
          + (0.019993 - 0.000101 * T) * Math.sin(2 * M) + 0.000289 * Math.sin(3 * M);
  const omega = (125.04 - 1934.136 * T) * RAD;
  return mod360(L0 + C - 0.00569 - 0.00478 * Math.sin(omega));
}

/* Lahiri ayanamsa, mean (good to about 0.01 deg for 1900-2100) */
function ayanamsa(jd) {
  const T = (jd - 2451545.0) / 36525;
  return 23.85306 + 1.39697 * T + 0.00018 * T * T;
}

/* tithi 1..30 at an instant; 1..15 waxing, 16..30 waning */
function tithiAt(date) {
  const jd = julianDay(date);
  const el = mod360(moonLongitude(jd) - sunLongitude(jd));
  return { n: Math.floor(el / 12) + 1, elong: el };
}
function phaseAt(date) { return tithiAt(date).n <= 15 ? 'wax' : 'wan'; }
function nakshatraAt(date) {
  const jd = julianDay(date);
  const sid = mod360(moonLongitude(jd) - ayanamsa(jd));
  return { idx: Math.floor(sid / (360 / 27)), sid, rasi: Math.floor(sid / 30) };
}

/* ---------- the panchang day and its ten slots ---------- */
const DAY_START_HOUR = 6;
const SLOT_MS = 144 * 60000; // 6 nazhigai = 2 h 24 min

function dayStartOf(date) {
  const d = new Date(date.getTime());
  if (d.getHours() < DAY_START_HOUR) d.setDate(d.getDate() - 1);
  d.setHours(DAY_START_HOUR, 0, 0, 0);
  return d;
}

/* all ten slots of the panchang day that begins at `start` */
function slotsOfDay(start, phase, bird) {
  const wd = start.getDay();
  const row = SLOT[phase][bird][wd];
  const out = [];
  for (let i = 0; i < 10; i++) {
    const part = i < 5 ? 'day' : 'night';
    const idx = i % 5;
    const act = row[part][idx];
    out.push({
      i, part, idx, act,
      from: new Date(start.getTime() + i * SLOT_MS),
      to: new Date(start.getTime() + (i + 1) * SLOT_MS),
      strength: STRENGTH[act],
    });
  }
  return out;
}

/* the slot at an instant; phase may be forced, otherwise taken at the day's start */
function slotAt(date, bird, forcedPhase) {
  const start = dayStartOf(date);
  const phase = forcedPhase || phaseAt(start);
  const slots = slotsOfDay(start, phase, bird);
  const k = Math.min(9, Math.max(0, Math.floor((date - start) / SLOT_MS)));
  return { start, phase, slots, slot: slots[k], k, wd: start.getDay() };
}

/* day-level notes for one bird: dormant day, strong day / night start */
function dayNotes(start, phase, bird) {
  const wd = start.getDay();
  const row = SLOT[phase][bird][wd];
  const padu = PADU[phase][bird].includes(wd);
  /* the book: a dormant day covers both day and night, so no strong-start is claimed on it */
  return { padu, oonDay: !padu && row.day[0] === 'E', oonNight: !padu && row.night[0] === 'E' };
}

/* the same notes when the weekday is already known (place-based days) */
function dayNotesWd(wd, phase, bird) {
  const row = SLOT[phase][bird][wd];
  const padu = PADU[phase][bird].includes(wd);
  return { padu, oonDay: !padu && row.day[0] === 'E', oonNight: !padu && row.night[0] === 'E' };
}

const _dtf = {};
/* offset of an IANA zone from UTC, in minutes, at a UTC instant (follows daylight saving and history) */
function tzOffsetMin(tz, ms) {
  let f = _dtf[tz];
  if (!f) {
    f = _dtf[tz] = new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric' });
  }
  const parts = f.formatToParts(new Date(ms));
  const g = (k) => Number(parts.find((x) => x.type === k).value);
  const asUTC = Date.UTC(g('year'), g('month') - 1, g('day'), g('hour') % 24, g('minute'), g('second'));
  return Math.round((asUTC - Math.floor(ms / 1000) * 1000) / 60000);
}

/* sunrise and sunset (UTC ms) for a civil date at a place; null in polar day or night (NOAA method) */
function sunTimes(y, m, d, lat, lon) {
  const jd = Date.UTC(y, m - 1, d, 12) / 86400000 + 2440587.5;
  const T = (jd - 2451545.0) / 36525;
  const L0 = mod360(280.46646 + T * (36000.76983 + T * 0.0003032));
  const M = 357.52911 + T * (35999.05029 - 0.0001537 * T);
  const e = 0.016708634 - T * (0.000042037 + 0.0000001267 * T);
  const Mr = M * RAD;
  const Cc = Math.sin(Mr) * (1.914602 - T * (0.004817 + 0.000014 * T)) + Math.sin(2 * Mr) * (0.019993 - 0.000101 * T) + Math.sin(3 * Mr) * 0.000289;

function polar(cx, cy, r, deg) { const a = (deg - 90) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; }

function dialSvg(ctx, bird, selIdx, showNeedle) {

    const a0 = i * 36 + 0.9, a1 = (i + 1) * 36 - 0.9;

    g += `<g data-slot="${i}" role="button" tabindex="0" aria-label="${esc(label)}">
      <path class="arc sv-${s.act}" d="${arcPath(cx, cy, r0, r1, a0, a1)}"/>
      ${s.act === 'D' ? `<path d="${arcPath(cx, cy, r0, r1, a0, a1)}" fill="url(#hatch)" pointer-events="none"/>` : ''}

  return `<svg class="dial" viewBox="-36 0 412 340" role="group" aria-label="${esc(t('schedule'))}">
    <defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="var(--hatch)" stroke-width="3"/></pattern></defs>

function civilToday(pl) {
  const off = pl.offsetMin !== undefined && pl.offsetMin !== null ? pl.offsetMin : C.tzOffsetMin(pl.tz, Date.now());
  const d = new Date(Date.now() + off * 60000);
  return [d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate()];
}
function shiftCivil(c, n) { const x = new Date(Date.UTC(c[0], c[1] - 1, c[2] + n)); return [x.getUTCFullYear(), x.getUTCMonth() + 1, x.getUTCDate()]; }
/* the Hindu day (sunrise to next sunrise) either for a chosen date or the one in force now */
function hinduDay(pl, dateStr) {
  if (dateStr) { const [y, m, d] = dateStr.split('-').map(Number); if (y >= 1900 && y <= 2200 && m >= 1 && m <= 12 && d >= 1 && d <= 31) return C.dayModel(y, m, d, pl); }
  let [y, m, d] = civilToday(pl);
  let dm = C.dayModel(y, m, d, pl);
  if (Date.now() < dm.rise) { [y, m, d] = shiftCivil([y, m, d], -1); dm = C.dayModel(y, m, d, pl); }
  return dm;
}
const dmDateStr = (dm) => `${dm.y}-${pad2(dm.m)}-${pad2(dm.d)}`;
const dmDateLabel = (dm) => new Date(Date.UTC(dm.y, dm.m - 1, dm.d)).toLocaleDateString(locale(), { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
const clk = (ms, off) => fmtAt(ms, off);
function plannerSubject() {
  if (!isClient() && S.pPerson) { const p = clientById(S.pPerson); if (p) return { bird: birdOf(p.birth), name: p.name, birth: p.birth }; }
  return { bird: myBird(), name: isClient() ? S.client.name : actName(), birth: S.birth };
}
function planRange(pl, bird, n, rate) {
  const first = hinduDay(pl, '');
  const out = [];
  for (let i = 0; i < n; i++) {
    const c = shiftCivil([first.y, first.m, first.d], i);
    const dm = i === 0 ? first : C.dayModel(c[0], c[1], c[2], pl);
    const phase = forced() || C.phaseAt(new Date(dm.bookStart));
    const notes = C.dayNotesWd(dm.wd, phase, bird);
    out.push({ dm, phase, plan: C.dayPlan(dm, bird, phase, rate, notes.padu), notes });
  }
  return out;
}
const bestWins = (plan) => plan.best.filter((w) => w.to - w.from >= 20 * 60000);
function winDesc(w) {
  const acts = [...new Set(w.segs.map((s) => s.act))].map((a) => an(a));
  const horas = [...new Set(w.segs.map((s) => s.hora).filter(Boolean))].map(pName);
  const kal = [...new Set(w.segs.map((s) => s.kalam).filter(Boolean))].map((k) => C.KALAM_NAME[k][S.lang === 'ta' ? 'ta' : 'en']);
  const ab = w.segs.some((s) => s.abhijit) ? [C.KALAM_NAME.abhijit[S.lang === 'ta' ? 'ta' : 'en']] : [];
  return [acts.join(' / '), horas.join(', ') + ' ' + t('pHora'), ...kal, ...ab].join(' · ');
}

let toastTimer = null;
function renderToast() {
  const el = $('#toast'); if (!el) return;
  el.innerHTML = esc(S.toast) + (S.toast && S.undo ? ` <button type="button" class="btn" data-x="undo" style="min-height:30px;padding:2px 10px;margin-left:8px">${esc(t('undo'))}</button>` : '');
  el.hidden = !S.toast;
}
function toast(msg, undo) {
  S.toast = msg; if (!undo) S.undo = null;
  renderToast();
  clearTimeout(toastTimer);
  if (msg) toastTimer = setTimeout(() => { S.toast = ''; S.undo = null; renderToast(); }, undo ? 10000 : 15000);
}
async function saveFile(name, mime, text) {
  const ext = name.split('.').pop();
  try {
    if (window.claude && window.claude.use && ['csv', 'json', 'html', 'txt'].includes(ext)) {
      const dl = await window.claude.use('downloads');
      if (dl) { await dl.save({ filename: name, data: text }); return; }
    }
  } catch (e) { if (e && e.code === 'declined') return; }
  try {
    const url = URL.createObjectURL(new Blob([text], { type: mime }));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch (e) { toast(t('copyFail')); }
}
async function copyText(txt, inputSel) {
  try { await navigator.clipboard.writeText(txt); toast(t('copied')); return; } catch (e) { /* fall through */ }
  try { const i = $(inputSel); if (i) { i.focus(); i.select(); if (document.execCommand('copy')) { toast(t('copied')); return; } } } catch (e) { /* ignore */ }
  toast(t('copyFail'));
}

const remFired = new Set();
function checkReminders() {
  if (!S.rem.on) return;
  try {
    const pl = placeOf({ placeId: S.hPlace }), subj = plannerSubject(), act = curAct(), now = Date.now(), lead = S.rem.min * 60000;
    planRange(pl, subj.bird, 2, act.r || undefined).forEach((d) => bestWins(d.plan).forEach((w) => {
      const key = subj.bird + act.id + Math.round(w.from);
      if (now >= w.from - lead && now < w.to && !remFired.has(key)) {
        remFired.add(key);
        const msg = `${t('remTitle')}: ${clk(w.from, d.dm.off)} – ${clk(w.to, d.dm.off)} · ${actLabel(act)} · ${bn(subj.bird)}`;
        toast(msg);
        try { if (typeof Notification !== 'undefined' && Notification.permission === 'granted') new Notification(t('remTitle'), { body: msg }); } catch (e) { /* ignore */ }
      }
    }));
  } catch (e) { /* ignore */ }
}

  else if (id === 'noteKind') { S.noteKind = KINDS.includes(v) ? v : 'consult'; }
  else if (id === 'linkDays') { S.linkDays = [0, 7, 30, 90].includes(Number(v)) ? Number(v) : 30; const cp = clientById(S.clientSel); if (cp && cp.acct) { cp.acct.ex = accExpiry(); save(); } S.link = ''; S.linkFor = null; re(true); }
  else if (id === 'cdStatus') { const p = clientById(S.clientSel); if (p && ST.includes(v)) { p.status = v; save(); re(true); } }
  else if (id === 'cdShN' || id === 'cdShP' || id === 'cdShH') { const p = clientById(S.clientSel); if (p) { p.share = Object.assign({}, shareOf(p), { [{ cdShN: 'notes', cdShP: 'plan', cdShH: 'hora' }[id]]: e.target.checked }); S.link = ''; S.linkFor = null; save(); re(true); } }
  else if (id === 'autoLock') { S.admin.autoLock = [0, 5, 15, 30, 60].includes(Number(v)) ? Number(v) : 15; lastAct = Date.now(); save(); }
  else if (id === 'impFile') {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const j = JSON.parse(String(rd.result));
        if (!j || j.app !== 'pancha-pakshi' || !Array.isArray(j.people)) throw new Error('bad');
        let n = 0;
        j.people.forEach((x) => { const p = normPerson(x); if (!p) return; const i = S.people.findIndex((y) => y.id === p.id); if (i >= 0) { S.people[i] = p; n++; } else if (S.people.length < 300) { S.people.push(p); n++; } });
        if (j.admin && typeof j.admin === 'object') { const na = normAdmin(Object.assign({}, S.admin, { biz: j.admin.biz, contact: j.admin.contact, cv: j.admin.cv })); S.admin = na; }
        S.adminMsg = t('impOk')(n); save();
      } catch (er) { S.adminMsg = t('impBad'); }
      renderAll();
    };
    rd.readAsText(f);
  }
}
function onInput2(e) {
  const id = e.target.id;
  if (id === 'cNew' && $('#aMeter')) updMeter(e.target.value);
  if (id === 'cQ') { S.clientQ = e.target.value; const pos = e.target.selectionStart; renderAll(); const n = $('#cQ'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (er) { /* ignore */ } } }
  else if (id === 'noteText') S.noteDraft = e.target.value;
}

['pointerdown', 'keydown'].forEach((ev) => document.addEventListener(ev, () => { lastAct = Date.now(); }, true));

['keydown', 'keyup'].forEach((ev) => document.addEventListener(ev, (e) => { if (e.target && e.target.tagName === 'INPUT' && e.getModifierState) { const on = e.getModifierState('CapsLock'); document.querySelectorAll('[data-caps]').forEach((n) => { n.hidden = !on; }); } }, true));


/* ---------- shell ---------- */
function tabsFor() {
  if (isClient()) {
    if (S.client.bad || S.client.expired) return ['learn'];
    const o = S.client.o;
    return ['me', 'now', 'week', o.hora ? 'horai' : null, o.plan ? 'plan' : null, o.notes && S.client.nt.length ? 'notes' : null, 'learn'].filter(Boolean);
  }
  const a = ['now', 'week', 'horai', 'plan'];
  if (isAdmin()) a.push('clients');
  a.push('birds', 'learn');
  if (isAdmin()) a.push('admin');
  return a;
}
function renderTabs() {
  $('#tabs').innerHTML = tabsFor().map((k) => `<button type="button" role="tab" id="tab-${k}" data-tab="${k}" aria-selected="${S.tab === k}" aria-controls="panel">${esc(t(k))}${k === 'clients' && dueCount() ? ` (${dueCount()})` : ''}</button>`).join('');
}
const RENDER = { now: renderNow, week: renderWeek, horai: renderHorai, plan: renderPlan, clients: renderClients, birds: renderBirds, learn: renderLearn, admin: renderAdmin, me: renderMe, notes: renderNotes, report: renderReport };
let rendering = false;
function renderAll() {
  if (rendering) return;
  rendering = true;
  try { renderAllInner(); } finally { rendering = false; }
}
function renderAllInner() {
  document.documentElement.lang = S.lang === 'ta' ? 'ta' : 'en';
  $('#ttl').textContent = t('title');
  $('#sub').textContent = t('sub');
  document.querySelectorAll('.langs button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === S.lang)));
  renderEntry();
  const authOn = !isClient() && !isAdmin();
  document.body.classList.toggle('auth-mode', authOn);
  if (authOn) {
    $('#banner').innerHTML = ''; $('#tabs').innerHTML = '';
    const pn = $('#panel'); pn.removeAttribute('aria-labelledby'); pn.setAttribute('role', 'region'); pn.style.cssText = 'display:block';
    pn.innerHTML = S.booting ? `<div class="auth-boot" role="status">${esc(t('loadingApp'))}</div>` : renderLogin();
    renderToast(); renderSync(); return;
  }
  if (S.tab === 'report' ? !isAdmin() : !tabsFor().includes(S.tab)) S.tab = tabsFor()[0];
  document.documentElement.lang = S.lang === 'ta' ? 'ta' : 'en';
  $('#ttl').textContent = t('title');
  $('#sub').textContent = t('sub');
  document.querySelectorAll('.langs button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === S.lang)));
  renderBanner();
  renderTabs();
  const p = $('#panel');
  p.setAttribute('role', 'tabpanel'); p.setAttribute('aria-labelledby', 'tab-' + S.tab);
  p.style.cssText = 'display:flex;flex-direction:column;gap:16px';
  p.innerHTML = RENDER[S.tab]();
  renderToast(); renderSync();
}
function go(tab) { S.tab = tabsFor().includes(tab) ? tab : tabsFor()[0]; S.sel = null; renderAll(); window.scrollTo(0, 0); }

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-dletter],#padd,#pupd,[data-puse],[data-pdel],[data-pdelc],[data-via],[data-lang],[data-tab],[data-phase],[data-slot],[data-wk],[data-goto],[data-bphase],[data-method],[data-letter],[data-rphase],#atReset');
  if (!el) return;
  const d = el.dataset;
  if (d.lang) { S.lang = d.lang; save(); renderAll(); }
  else if (d.tab) go(d.tab);
  else if (d.goto) go(d.goto);
  else if (d.phase) { S.phaseMode = d.phase; S.sel = null; save(); renderAll(); }
  else if (d.slot !== undefined) { S.sel = Number(d.slot); refreshLive(); }
  else if (d.wk) { S.wkSel = S.wkSel === d.wk ? null : d.wk; const y = window.scrollY; renderAll(); window.scrollTo(0, y); }
  else if (d.bphase) { S.birth.phase = d.bphase; S.personal = true; save(); renderAll(); }
  else if (d.method) { S.birth.method = d.method; if (d.method === 'dob') applyDob(); S.personal = true; save(); renderAll(); }
  else if (d.dletter !== undefined) { S.birth.dobLetter = Number(d.dletter); S.personal = true; save(); renderAll(); }
  else if (d.via) { S.birth.dobVia = d.via; S.personal = true; save(); renderAll(); }
  else if (d.letter !== undefined) { S.birth.letter = Number(d.letter); S.personal = true; save(); renderAll(); }
  else if (d.rphase) { S.refPhase = d.rphase; renderAll(); }
  else if (el.id === 'padd') {
    const nmv = (S.nameDraft || '').trim().slice(0, 40) || (S.lang === 'ta' ? 'நபர் ' : 'Person ') + (S.people.length + 1);
    const id = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    S.people.push({ id, name: nmv, birth: JSON.parse(JSON.stringify(S.birth)), phone: '', tags: '', follow: '', created: Date.now(), notes: [], status: 'new', share: null, acct: null });
    S.activeId = id; S.nameDraft = ''; S.personal = true; S.newClient = false;
    if (isAdmin() && S.padAcct !== false && cryptoOk()) ensureAcct(S.people[S.people.length - 1]);
    save();
    if (isAdmin()) { S.clientSel = id; go('clients'); } else renderAll();
  }
  else if (el.id === 'pupd') {
    const a = S.people.find((x) => x.id === S.activeId);
    if (a) { a.birth = JSON.parse(JSON.stringify(S.birth)); if ((S.nameDraft || '').trim()) a.name = S.nameDraft.trim().slice(0, 40); S.nameDraft = ''; save(); renderAll(); }
  }
  else if (d.puse) { const a = S.people.find((x) => x.id === d.puse); if (a) { S.birth = JSON.parse(JSON.stringify(a.birth)); S.activeId = a.id; S.personal = true; save(); renderAll(); } }
  else if (d.pdel) { S.confirmDel = d.pdel; renderAll(); }
  else if (d.pdelc) { S.people = S.people.filter((x) => x.id !== d.pdelc); if (S.activeId === d.pdelc) S.activeId = null; S.confirmDel = null; save(); renderAll(); }
  else if (el.id === 'atReset') { S.at = null; S.sel = null; renderAll(); }
});
document.addEventListener('click', onX);
document.addEventListener('change', onChange2);
document.addEventListener('input', onInput2);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && ['lUser', 'lPass'].includes(e.target.id)) { const bt = document.querySelector('[data-x="signin"]'); if (bt) bt.click(); }
});
document.addEventListener('keydown', (e) => {
  const g = e.target.closest && e.target.closest('g[data-slot]');
  if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); S.sel = Number(g.dataset.slot); refreshLive(); }
});
function applyDob() {
  const i = dobInfo();
  if (i) { S.birth.phase = i.phase; S.birth.nak = i.nak; S.birth.tithi = (i.n - 1) % 15; S.birth.rasi = i.rasi; S.birth.weekday = i.wd; }
}
document.addEventListener('input', (e) => { if (e.target.id === 'pName') S.nameDraft = e.target.value; });
document.addEventListener('change', (e) => {
  const id = e.target.id;
  if (id === 'atInput') { const v = e.target.value; S.at = v ? new Date(v).getTime() : null; S.sel = null; renderAll(); }
  else if (id === 'nakSel') { S.birth.nak = Number(e.target.value); S.personal = true; save(); renderAll(); }
  else if (id === 'dobDate' || id === 'dobTime') {
    S.birth[id] = e.target.value; applyDob(); S.personal = true; save(); renderAll();
  }
  else if (id === 'placeSel') { S.birth.placeId = e.target.value; applyDob(); S.personal = true; save(); renderAll(); }
  else if (id === 'cName' || id === 'cLat' || id === 'cLon' || id === 'cOff') { S.birth.custom = Object.assign({ name: '', lat: '', lon: '', offH: '5.5' }, S.birth.custom); S.birth.custom[{ cName: 'name', cLat: 'lat', cLon: 'lon', cOff: 'offH' }[id]] = e.target.value; applyDob(); S.personal = true; save(); renderAll(); }
  else if (id === 'tithiSel') { S.birth.tithi = Number(e.target.value); S.personal = true; save(); renderAll(); }
  else if (id === 'rasiSel') { S.birth.rasi = Number(e.target.value); S.personal = true; save(); renderAll(); }
  else if (id === 'wdSel') { S.birth.weekday = Number(e.target.value); S.personal = true; save(); renderAll(); }
  else if (id === 'cmpA' || id === 'cmpB') { S[id] = e.target.value; renderAll(); }
});

load();
if (S.hPlace === null) S.hPlace = defaultPlaceId();
if (S.birth.placeId === null || S.birth.placeId === undefined) S.birth.placeId = defaultPlaceId();
renderAll();
bootSession();
window.addEventListener('hashchange', () => { if (!isClient() && !isAdmin()) renderAll(); });
window.addEventListener('error', (e) => { if (e && e.message) toast(t('errGeneric')); });
window.addEventListener('unhandledrejection', () => toast(t('errGeneric')));
let tick = 0;
setInterval(() => {
  liveUpdate(); checkReminders(); checkAutoLock(); tick++;
  const ae = document.activeElement;
  if (tick % 3 === 0 && S.tab === 'horai' && !S.hDate && !(ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName))) { const y = window.scrollY; renderAll(); window.scrollTo(0, y); }
}, 20000);
})();
</script>
</body>
